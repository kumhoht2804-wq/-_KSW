<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금호HT 모듈개발연구소</title>
<meta name="author" content="KSW">
<meta name="copyright" content="© KSW">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: sticky header with tabs, full-width work area of dense tables; summary first, detail below. */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#16202A; --muted:#5D6A78; --line:#DCE2E9; --accent:#1E5A8C;
  --accent-soft:#E3EDF6; --sunk:#EEF1F5; --input:#FFF8DC;
  --ok:#2E7D4F; --ok-soft:#DDF1E4; --warn:#A86A00; --warn-soft:#FFF0CC; --bad:#B83A3A; --bad-soft:#F8DADA;
  --lvA:#D6E8FB; --lvAi:#1B4F82; --lvB:#D9F0E1; --lvBi:#22643C; --lvC:#FFEFC7; --lvCi:#7A5300; --lvD:#FCE1CF; --lvDi:#8A4413; --lvX:#F6D2D2; --lvXi:#952B2B;
  --dA:#2F6FB3; --dB:#2E9A5C; --dC:#E3A21A; --dD:#E2672B; --dX:#C23B3B;
  --font-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:var(--font-body);
  --h:34px; --h-sm:28px;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1318; --surface:#151C23; --ink:#E3E9EF; --muted:#94A2B0; --line:#29333D; --accent:#6EA8DA;
  --accent-soft:#1B2B3A; --sunk:#111820; --input:#2A2614;
  --ok:#6CC28F; --ok-soft:#173023; --warn:#E2B04E; --warn-soft:#33290F; --bad:#EE8080; --bad-soft:#3A1A1A;
  --lvA:#1C3550; --lvAi:#A9CFF5; --lvB:#173524; --lvBi:#9FDDB6; --lvC:#3A2F12; --lvCi:#F0D18A; --lvD:#3D2615; --lvDi:#F3B98F; --lvX:#3E1B1B; --lvXi:#F3A3A3;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0E1318; --surface:#151C23; --ink:#E3E9EF; --muted:#94A2B0; --line:#29333D; --accent:#6EA8DA;
  --accent-soft:#1B2B3A; --sunk:#111820; --input:#2A2614;
  --ok:#6CC28F; --ok-soft:#173023; --warn:#E2B04E; --warn-soft:#33290F; --bad:#EE8080; --bad-soft:#3A1A1A;
  --lvA:#1C3550; --lvAi:#A9CFF5; --lvB:#173524; --lvBi:#9FDDB6; --lvC:#3A2F12; --lvCi:#F0D18A; --lvD:#3D2615; --lvDi:#F3B98F; --lvX:#3E1B1B; --lvXi:#F3A3A3;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:15px}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.busy{background:var(--warn)} .dot.off{background:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1318}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.admin{background:var(--accent);color:#fff}
main{padding:16px 20px;display:flex;flex-direction:column;gap:16px;max-width:none;margin:0}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--sunk);color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:15px}
.card .sub{font-size:12px;color:var(--muted)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--accent)}
.kpi.edu{border-top-color:var(--ok)}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:600 24px/1.2 var(--font-num)}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.pchip .c{font:500 11px var(--font-num);color:var(--muted)}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 200px)}
.tw.free{max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted);z-index:2}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.c,th.c{text-align:center} td.r,th.r{text-align:right}
.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
thead .sticky{z-index:3;background:var(--sunk)}
.sticky2{position:sticky;left:var(--s2,48px);background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
thead .sticky2{z-index:3;background:var(--sunk)}
th.item{white-space:normal;min-width:84px;max-width:110px;font-weight:500;line-height:1.3;vertical-align:bottom}
th.item .w{display:block;margin-top:4px;font:600 11px var(--font-num);color:var(--ink)}
th.item.K{border-top:3px solid var(--accent)} th.item.S{border-top:3px solid var(--ok)}
th.course{white-space:normal;min-width:44px;max-width:56px;font-weight:500;font-size:11px;line-height:1.25;vertical-align:bottom;writing-mode:vertical-rl;text-orientation:mixed;height:150px;padding:6px 4px}
th.course .t{font-size:10px;color:var(--accent)}
.lv{display:inline-flex;min-width:34px;justify-content:center;padding:1px 8px;border-radius:5px;font-weight:700;font-size:12px}
.lv-A{background:var(--lvA);color:var(--lvAi)} .lv-B{background:var(--lvB);color:var(--lvBi)} .lv-C{background:var(--lvC);color:var(--lvCi)} .lv-D{background:var(--lvD);color:var(--lvDi)} .lv-X{background:var(--lvX);color:var(--lvXi)}
.g{display:inline-flex;width:30px;height:24px;align-items:center;justify-content:center;border-radius:5px;font-weight:700;font-size:12px;background:var(--sunk);color:var(--muted)}
.g-S{background:var(--lvA);color:var(--lvAi)} .g-A{background:var(--lvB);color:var(--lvBi)} .g-B{background:var(--lvC);color:var(--lvCi)} .g-C{background:var(--lvD);color:var(--lvDi)} .g-D{background:var(--lvX);color:var(--lvXi)}
select.gsel{appearance:none;width:38px;height:26px;border:1px solid var(--line);border-radius:5px;text-align:center;text-align-last:center;font-weight:700;font-size:12px;cursor:pointer;background:var(--input)}
select.gsel.g-S,select.gsel.g-A,select.gsel.g-B,select.gsel.g-C,select.gsel.g-D{border-color:transparent}
.mk{display:inline-flex;width:26px;height:22px;align-items:center;justify-content:center;border-radius:4px;font-size:13px}
.mk.done{color:var(--ink)} .mk.up{color:var(--accent)} .mk.miss{background:var(--bad-soft)}
button.mk{border:1px dashed transparent;background:none;cursor:pointer;padding:0}
button.mk:hover{border-color:var(--accent)}
button.mk.miss:hover{background:var(--bad-soft)}
.rate{display:inline-flex;align-items:center;gap:6px}
.meter{width:56px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.ok i{background:var(--ok)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--sunk);min-width:120px}
.stack span{display:flex;align-items:center;justify-content:center;font:600 11px var(--font-num)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden;position:relative}
.hbar .track i{display:block;height:100%;background:var(--ok);border-radius:3px}
.muted{color:var(--muted)} .small{font-size:12px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea,input.ci,select.ci,textarea.ci{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--ink);font-size:13px;min-width:0}
input.ci,select.ci{padding:4px 6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.link{background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{color:var(--accent);text-decoration-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .field{flex-direction:row;align-items:center;gap:6px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.wide{width:min(900px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,16,22,.45)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:20px;max-height:calc(100vh - 80px);overflow:auto}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--bad);font-size:12px;min-height:16px}
.toast{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:360px}
.toast div.bad{background:var(--bad);color:#fff}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;display:none;min-width:260px;z-index:30}
.menu.open .pop{display:flex;flex-direction:column}
.menu .pop button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column}
.menu .pop button:hover{background:var(--sunk)}
.menu .pop small{color:var(--muted);font-size:11px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.sumrow td{background:var(--sunk);font-weight:600}
.ro{background:transparent!important;border-color:transparent!important}
footer.foot{padding:16px 20px 24px;text-align:center;font-size:12px;color:var(--muted)}
footer.foot b{color:var(--ink);font-weight:600}
footer.foot .fv{display:block;margin-top:3px;font-size:11px;opacity:.8}
@media (max-width:640px){main{padding:12px}.bar{padding:10px 12px}.g2{grid-template-columns:1fr}.hbar{grid-template-columns:80px 1fr 48px}}
/* ---- 정렬·통일 ---- */
body{font-size:14px;letter-spacing:-0.01em}
.num,td,th{font-variant-numeric:tabular-nums}
.card p{margin:0}
.btn{height:var(--h);padding:0 14px;font-size:13px;justify-content:center}
.btn.sm{height:var(--h-sm);padding:0 10px;font-size:12px}
.btn.wide{width:100%}
.seg{height:var(--h);align-items:stretch}
.seg button{padding:0 14px;font-size:13px}
input.ci,select.ci,.field input,.field select,.field textarea{height:var(--h);padding:0 10px;font-size:13px}
.field textarea{height:auto;padding:8px 10px}
td input.ci,td select.ci{height:30px}
.toolbar{gap:12px;min-height:var(--h)}
.toolbar .field{font-size:13px;gap:8px}
.toolbar .field span{white-space:nowrap}
.pchip{height:32px;padding:0 14px}
.chip{height:26px;padding:0 10px}
.who-name{font-weight:600;font-size:13px}
#who{display:flex;align-items:center;gap:6px}
.sync{gap:8px}
.kpi .v{font:700 26px/1.2 var(--font-body)}
.kpi .v small{font-size:13px}
th,td{padding:8px 10px}
thead th{font-size:12px;letter-spacing:0}
.head{min-height:28px}
.card .sub{font-size:12.5px}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-left:4px}
.card.auth{max-width:420px;margin:56px auto;gap:16px}
.card.auth h2{font-size:18px}
.form.one{grid-template-columns:1fr}
.form.two{grid-template-columns:1fr 1fr;display:grid;gap:10px}
.form .actions,.dlg .actions{display:flex;justify-content:flex-end;gap:8px}
.auth-foot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:12px}
/* 이수/미이수 표시 */
.pill{display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:52px;padding:0 8px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.miss{background:var(--bad-soft);color:var(--bad)}
.pill.pre{background:var(--surface);color:var(--ok);border-color:var(--ok);border-style:dashed}
.pill.add{background:transparent;color:var(--line);border:1px dashed transparent;min-width:28px}
tr:hover .pill.add{color:var(--muted);border-color:var(--line)}
.pill.add:hover{color:var(--ok)!important;border-color:var(--ok)!important}
.cchip.pre{background:var(--surface);border:1px dashed var(--ok);color:var(--ok);font-weight:600}
button.pill{cursor:pointer;font-family:inherit}
button.pill:hover{border-color:currentColor}
.legend-inline{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 교육명 열 제목: 가로 글씨 */
th.course{writing-mode:horizontal-tb;height:auto;width:84px;min-width:84px;max-width:84px;padding:8px 6px;white-space:normal;vertical-align:bottom;text-align:center;font-size:11.5px;line-height:1.3;font-weight:600;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
th.course .cn{display:block}
th.course .cd{display:block;margin-top:4px;font-size:10.5px;font-weight:500;color:var(--muted)}
th.item{text-align:center;min-width:96px;max-width:120px;font-size:11.5px;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.g{width:32px;height:26px}
select.gsel{width:44px;height:28px}
.lv{min-width:38px;height:22px;align-items:center}
.hbar{grid-template-columns:96px 1fr 48px}
.hbar .num.r{text-align:right}
footer.foot{border-top:1px solid var(--line);margin-top:8px}
.unit{font-size:11px;color:var(--muted);margin-left:1px}
/* 표 정렬 원칙: 제목 줄은 가운데, 숫자·상태·날짜는 가운데, 글자는 왼쪽 */
table thead th{text-align:center!important}
.lvtbl{table-layout:fixed;width:100%}
.lvtbl col{width:12%}
.lvtbl col.w{width:52%}
#view table td,#dlgBody table td{text-align:center}
#view table td.l,#dlgBody table td.l{text-align:left}
/* ---- 조직도 ---- */
.orgw{overflow-x:auto}
.org{min-width:1100px}
.ob{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1.3}
.ob b{font-size:13px;font-weight:700}
.ob small{font-size:11.5px;color:var(--muted)}
.ob em{position:absolute;right:7px;top:5px;font:600 10.5px var(--font-num);color:var(--muted);font-style:normal}
.ob.lead{width:calc(100% - 8px);max-width:170px;height:46px;background:var(--accent-soft);border-color:transparent}
.ob.lead b{color:var(--accent)}
.ovl{display:block;width:1px;height:14px;background:var(--oln)}
.org{--oln:color-mix(in srgb,var(--muted) 45%,transparent)}
.obr{display:flex;position:relative;align-items:stretch}
.ohl{position:absolute;top:53px;height:0;border-top:1px solid var(--oln)}
.obc{display:flex;flex-direction:column;align-items:center;min-width:0;position:relative}
.obc.ext{padding-top:60px}
.obc.ext::before{content:'';position:absolute;top:53px;left:calc(50% - .5px);height:7px;border-left:1px solid var(--oln)}
.obc>.oteams{align-self:stretch}
.oteams{display:flex;align-items:flex-start}
.ot,.op{position:relative;padding:12px 3px 0;display:flex;flex-direction:column;align-items:stretch;min-width:0}
.ot::before,.op::before{content:'';position:absolute;top:0;left:calc(50% - .5px);height:12px;border-left:1px solid var(--oln)}
.ot::after,.op::after{content:'';position:absolute;top:0;left:0;right:0;border-top:1px solid var(--oln)}
.ot:first-child::after,.op:first-child::after{left:50%}
.ot:last-child::after,.op:last-child::after{right:50%}
.ot:only-child::after,.op:only-child::after{display:none}
.oteams.solo .ot{padding-top:0}.oteams.solo .ot::before{display:none}
.ob.team{background:var(--sunk);border-color:transparent;height:42px}
.oparts{display:flex;align-items:flex-start}
.op{flex:1 1 0}
.ob.part{height:30px;border-top:3px solid var(--pc,var(--line))}
.ob.part b{font-size:12.5px}

// Works in browser (crypto.subtle) and node (globalThis.crypto.subtle).
const XLSX = (() => {
  const enc = new TextEncoder();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const colName = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const ref = (r, c) => colName(c) + (r + 1);

  // ---- CRC32 + STORE zip ----
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) { // [{name, data:Uint8Array}]
    const parts = [], central = []; let off = 0;
    for (const f of files) {
      const nm = enc.encode(f.name), d = f.data, crc = crc32(d);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true);
      h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), nm, d);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true);
      c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nm);
      off += 30 + nm.length + d.length;
    }
    const csize = central.reduce((a, b) => a + b.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, csize, true); e.setUint32(16, off, true);
    const all = [...parts, ...central, new Uint8Array(e.buffer)];
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0)); let p = 0;
    for (const a of all) { out.set(a, p); p += a.length; }
    return out;
  }

  // ---- password hash (SHA-512, spin) ----
  const b64 = u8 => { let s = ''; for (const x of u8) s += String.fromCharCode(x); return btoa(s); };
  async function passwordHash(pw, spin) {
    const subtle = globalThis.crypto.subtle;
    const salt = globalThis.crypto.getRandomValues(new Uint8Array(16));
    const pwb = new Uint8Array(pw.length * 2); for (let i = 0; i < pw.length; i++) { const c = pw.charCodeAt(i); pwb[i * 2] = c & 255; pwb[i * 2 + 1] = c >> 8; }
    const buf = new Uint8Array(16 + pwb.length); buf.set(salt); buf.set(pwb, 16);
    let h = new Uint8Array(await subtle.digest('SHA-512', buf));
    const it = new Uint8Array(68);
    for (let i = 0; i < spin; i++) { it.set(h); it[64] = i & 255; it[65] = (i >>> 8) & 255; it[66] = (i >>> 16) & 255; it[67] = (i >>> 24) & 255; h = new Uint8Array(await subtle.digest('SHA-512', it)); }
    return { salt: b64(salt), hash: b64(h), spin };
  }

  // ---- styles ----
  function styleBook() {
    const fonts = ['<font><sz val="10"/><name val="맑은 고딕"/></font>'], fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'],
      borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'], numFmts = [], xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    const idx = (arr, x) => { let i = arr.indexOf(x); if (i < 0) { arr.push(x); i = arr.length - 1; } return i; };
    const cache = new Map();
    function get(st) {
      if (!st) return 0; const k = JSON.stringify(st); if (cache.has(k)) return cache.get(k);
      const font = `<font>${st.bold ? '<b/>' : ''}<sz val="${st.size || 10}"/>${st.color ? `<color rgb="FF${st.color}"/>` : ''}<name val="맑은 고딕"/></font>`;
      const fi = idx(fonts, font);
      const fl = st.fill ? idx(fills, `<fill><patternFill patternType="solid"><fgColor rgb="FF${st.fill}"/><bgColor indexed="64"/></patternFill></fill>`) : 0;
      const bc = 'FFC9CED6';
      const bd = st.border ? idx(borders, `<border><left style="thin"><color rgb="${bc}"/></left><right style="thin"><color rgb="${bc}"/></right><top style="thin"><color rgb="${bc}"/></top><bottom style="thin"><color rgb="${bc}"/></bottom><diagonal/></border>`) : 0;
      let nf = 0; if (st.fmt) { const builtin = { '0%': 9, '0.00%': 10, '0': 1, '0.00': 2 }; nf = builtin[st.fmt] ?? (164 + idx(numFmts, st.fmt)); }
      const al = (st.h || st.v || st.wrap) ? `<alignment${st.h ? ` horizontal="${st.h}"` : ''} vertical="${st.v || 'center'}"${st.wrap ? ' wrapText="1"' : ''}/>` : '<alignment vertical="center"/>';
      const pr = st.unlocked ? '<protection locked="0"/>' : '';
      const xf = `<xf numFmtId="${nf}" fontId="${fi}" fillId="${fl}" borderId="${bd}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"${nf ? ' applyNumberFormat="1"' : ''}${pr ? ' applyProtection="1"' : ''}>${al}${pr}</xf>`;
      const i = idx(xfs, xf); cache.set(k, i); return i;
    }
    function xml() {
      const nfx = numFmts.length ? `<numFmts count="${numFmts.length}">${numFmts.map((f, i) => `<numFmt numFmtId="${164 + i}" formatCode="${esc(f)}"/>`).join('')}</numFmts>` : '';
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${nfx}<fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="${borders.length}">${borders.join('')}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    }
    return { get, xml };
  }

  // ---- sheet model ----
  class Sheet {
    constructor(name) { this.name = name.slice(0, 31); this.rows = new Map(); this.cols = []; this.merges = []; this.dv = []; this.freeze = null; this.heights = {}; }
    set(r, c, v, st) { if (!this.rows.has(r)) this.rows.set(r, new Map()); this.rows.get(r).set(c, { v, st }); return this; }
    f(r, c, formula, result, st) { return this.set(r, c, { f: formula, r: result }, st); }
    merge(r1, c1, r2, c2) { this.merges.push(ref(r1, c1) + ':' + ref(r2, c2)); }
    width(c, w) { this.cols[c] = w; }
    list(r1, c1, r2, c2, items) { this.dv.push({ sq: ref(r1, c1) + ':' + ref(r2, c2), items }); }
  }

  function cellXml(r, c, cell, sb) {
    const s = sb.get(cell.st), a = ` r="${ref(r, c)}"${s ? ` s="${s}"` : ''}`, v = cell.v;
    if (v == null || v === '') return `<c${a}/>`;
    if (typeof v === 'object' && v.f != null) {
      const res = v.r;
      if (res == null || res === '') return `<c${a} t="str"><f>${esc(v.f)}</f><v></v></c>`;
      if (typeof res === 'number') return `<c${a}><f>${esc(v.f)}</f><v>${res}</v></c>`;
      return `<c${a} t="str"><f>${esc(v.f)}</f><v>${esc(res)}</v></c>`;
    }
    if (typeof v === 'number' && isFinite(v)) return `<c${a}><v>${v}</v></c>`;
    if (typeof v === 'boolean') return `<c${a} t="b"><v>${v ? 1 : 0}</v></c>`;
    return `<c${a} t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  }

  function sheetXml(sh, sb, prot) {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
    x += '<sheetViews><sheetView workbookViewId="0" showGridLines="0">';
    if (sh.freeze) { const { row = 0, col = 0 } = sh.freeze; x += `<pane${col ? ` xSplit="${col}"` : ''}${row ? ` ySplit="${row}"` : ''} topLeftCell="${ref(row, col)}" activePane="${row && col ? 'bottomRight' : row ? 'bottomLeft' : 'topRight'}" state="frozen"/>`; }
    x += '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16.5"/>';
    const cw = sh.cols.map((w, i) => w ? `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>` : '').join('');
    if (cw) x += `<cols>${cw}</cols>`;
    x += '<sheetData>';
    for (const r of [...sh.rows.keys()].sort((a, b) => a - b)) {
      const row = sh.rows.get(r), ht = sh.heights[r];
      x += `<row r="${r + 1}"${ht ? ` ht="${ht}" customHeight="1"` : ''}>`;
      for (const c of [...row.keys()].sort((a, b) => a - b)) x += cellXml(r, c, row.get(c), sb);
      x += '</row>';
    }
    x += '</sheetData>';
    if (prot) x += `<sheetProtection algorithmName="SHA-512" hashValue="${prot.hash}" saltValue="${prot.salt}" spinCount="${prot.spin}" sheet="1" objects="1" scenarios="1" formatColumns="0" formatRows="0"/>`;
    if (sh.merges.length) x += `<mergeCells count="${sh.merges.length}">${sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>`;
    if (sh.dv.length) x += `<dataValidations count="${sh.dv.length}">${sh.dv.map(d => `<dataValidation type="list" allowBlank="1" showErrorMessage="1" errorTitle="입력 오류" error="목록에서 선택하세요" sqref="${d.sq}"><formula1>"${esc(d.items.join(','))}"</formula1></dataValidation>`).join('')}</dataValidations>`;
    x += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/></worksheet>';
    return x;
  }

  async function build(sheets, password, spin = 20000) {
    const prot = password ? (typeof password === 'object' ? password : await passwordHash(password, spin)) : null;
    const sb = styleBook();
    const files = [];
    const sx = sheets.map(s => sheetXml(s, sb, prot));
    files.push({ name: '[Content_Types].xml', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`) });
    files.push({ name: '_rels/.rels', data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>') });
    const ts = new Date().toISOString().slice(0, 19) + 'Z';
    files.push({ name: 'docProps/core.xml', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>KSW</dc:creator><cp:lastModifiedBy>KSW</cp:lastModifiedBy><dc:rights>© KSW</dc:rights><dcterms:created xsi:type="dcterms:W3CDTF">${ts}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${ts}</dcterms:modified></cp:coreProperties>`) });
    const wp = prot ? `<workbookProtection workbookAlgorithmName="SHA-512" workbookHashValue="${prot.hash}" workbookSaltValue="${prot.salt}" workbookSpinCount="${prot.spin}" lockStructure="1"/>` : '';
    files.push({ name: 'xl/workbook.xml', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><workbookPr/>${wp}<bookViews><workbookView/></bookViews><sheets>${sheets.map((s, i) => `<sheet name="${esc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`) });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`) });
    files.push({ name: 'xl/styles.xml', data: enc.encode(sb.xml()) });
    sx.forEach((x, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: enc.encode(x) }));
    return zip(files);
  }
  return { Sheet, build, colName, ref };
})();
if (typeof module !== 'undefined') module.exports = XLSX;

// shared pure logic (also inlined into page)
function makeCalc(S){
  const N=S.config.grades.length;
  const gf=Object.fromEntries(S.config.grades.map(x=>[x.g,x.step/N]));
  const levels=[...S.config.levels].sort((a,b)=>b.min-a.min);
  const r1=v=>Math.round(v*10+1e-9)/10;
  function level(t){ if(t==null) return null; for(const l of levels) if(t>=l.min) return l.lv; return '미달'; }
  function comp(p){
    const L=S.items[p.cat]||[]; if(!L.length) return {target:false};
    const g=S.grades[p.id]||{}; const out={target:true,filled:0,total:L.length};
    for(const area of ['Knowledge','Skill']){
      const A=L.filter(i=>i.area===area); let sum=0,ok=A.length>0;
      for(const it of A){ const v=g[it.id]; if(v&&gf[v]!=null){sum+=it.ratio*50*gf[v]; out.filled++;} else ok=false; }
      out[area==='Knowledge'?'K':'S']=ok?r1(sum):null;
    }
    out.T=(out.K!=null&&out.S!=null)?r1(out.K+out.S):null; out.lv=level(out.T); return out;
  }
  const rs=Object.fromEntries(S.config.rankStage.map(x=>[x.rank.trim(),x.stage]));
  const gs=Object.fromEntries(S.config.guideStage.map(x=>[x.label.trim(),x.stage]));
  const dm=Object.fromEntries(S.config.eduDeptMap.map(x=>[x.dept,x.edu]));
  function cStage(c){ return c.type==='필수'?(gs[c.rank]??null):(c.type==='선택'?0:null); }
  function eduField(p){ return dm[p.eduDept]??null; }
  function applies(c,p){ const f=eduField(p)||''; return c.dept==='공통'||(c.dept&&f.includes(c.dept)); }
  function cell(c,p){ // '◎' '●' '' and isTarget
    const ps=rs[p.rank], cs=cStage(c), r0=(S.edu[p.id]||{})[c.id];
    // autoFrozen 전(예전 데이터)에만 상위 직급 자동 인정. 굳힌 뒤에는 기록된 것만 이수
    const legacy=!(S.config&&S.config.autoFrozen);
    const ex=legacy&&!!(r0&&r0.x), rec=(r0&&r0.x)?null:r0;
    const req=c.type==='필수'&&cs!=null, ap=req&&applies(c,p), auto=legacy&&ap&&ps>cs;
    const mark=(auto&&!ex)?'◎':(rec?'●':'');
    return {mark,target:ap&&cs<=ps,rec,ex,auto};
  }
  function edu(p){
    let t=0,d=0,el=0,pre=0;
    for(const c of S.courses){ const x=cell(c,p); if(x.target){t++; if(x.mark) d++;} else if(c.type==='필수'&&x.rec&&x.mark!=='◎'){pre++;t++;d++;} /* 미리 들은 필수 교육은 대상·이수에 포함 */ if(c.type==='선택'&&x.rec) el++; }
    return {target:t,done:d,rate:t?d/t:null,elective:el,pre,stage:rs[p.rank]??null,field:eduField(p)};
  }
  const idxOf=(arr,v)=>{const i=arr.indexOf(v);return i<0?99:i;};
  const ord=p=>S.people.indexOf(p);
  const jd=p=>p.join||'9999';
  function cmp(keys){return (a,b)=>{for(const k of keys){const x=k(a),y=k(b);if(x<y)return -1;if(x>y)return 1;}return 0;};}
  function sortComp(L){return [...L].sort(cmp([p=>idxOf(S.config.teamOrder,p.team),p=>idxOf(S.config.partOrder,p.cat),p=>idxOf(S.config.rankOrder,p.rank),jd,p=>p.order??ord(p)]));}
  const deptKeys=()=>S.config.eduDeptMap.map(x=>x.dept);
  function sortEdu(L){return [...L].sort(cmp([p=>idxOf(S.config.teamOrder,p.team),p=>idxOf(deptKeys(),p.eduDept),p=>idxOf(S.config.rankOrder,p.rank),jd,p=>p.order??ord(p)]));}
  function teams(L){const t=[...new Set(L.map(p=>p.team))];return t.sort((a,b)=>idxOf(S.config.teamOrder,a)-idxOf(S.config.teamOrder,b));}
  function years(j){if(!j)return null;const d=new Date(j+'T00:00:00');if(isNaN(d))return null;return Math.round((Date.now()-d)/864e5/365.25*10)/10;}
  function eduValid(p){return p.edu&&rs[p.rank]!=null&&dm[p.eduDept]!=null;}
  function eduView(dept){
    const all=!dept||dept==='전체';
    const people=sortEdu(S.people.filter(p=>eduValid(p)&&(all||p.eduDept===dept)));
    const f=all?null:(dm[dept]||'');
    const co=S.config.courseDeptOrder||[];
    const courses=S.courses.map((c,i)=>({c,i})).filter(({c})=>c.type==='필수'&&cStage(c)!=null&&(all||c.dept==='공통'||f.includes(c.dept)))
      .sort((a,b)=>idxOf(co,a.c.dept)-idxOf(co,b.c.dept)||cStage(a.c)-cStage(b.c)||a.i-b.i).map(x=>x.c);
    return {people,courses};
  }
  return {comp,edu,cell,level,cStage,gf,rs,dm,sortComp,sortEdu,teams,years,eduView,eduValid,eduField};
}
if(typeof module!=='undefined') module.exports=makeCalc;

// Builds sheet models for the two workbooks from app state.
const Export = (() => {
  const H = { bold: true, fill: '1F3A5F', color: 'FFFFFF', h: 'center', border: true, wrap: true };
  const H2 = { bold: true, fill: 'E6EBF2', color: '1F2A37', h: 'center', border: true, wrap: true };
  const T = { bold: true, size: 14, color: '1F3A5F' };
  const B = { border: true };
  const BC = { border: true, h: 'center' };
  const IN = { border: true, h: 'center', fill: 'FFF7D6', unlocked: true };
  const LVF = { A: 'D9ECFF', B: 'DDF3E4', C: 'FFF1CC', D: 'FDE2CF', '미달': 'F9D0D0' };
  const lvSt = lv => ({ border: true, h: 'center', bold: true, fill: LVF[lv] || undefined });
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  function comp(S, C) {
    const { Sheet, colName: cn } = XLSX;
    const out = [];
    const people = C.sortComp(S.people);
    const res = people.map(p => ({ p, c: C.comp(p) }));
    const tg = res.filter(x => x.c.target), done = tg.filter(x => x.c.T != null);
    const avg = done.length ? done.reduce((a, x) => a + x.c.T, 0) / done.length : null;
    const lvls = [...S.config.levels.map(l => l.lv), '미달'];

    // 종합
    const s0 = new Sheet('종합');
    s0.set(0, 0, '연구소 인원 역량평가 현황', T); s0.set(0, 8, '기준일', H2); s0.set(0, 9, today(), BC);
    const tiles = [['평가 대상 인원', tg.length + '명'], ['평가 완료', done.length + '명 (' + (tg.length ? Math.round(done.length / tg.length * 100) : 0) + '%)'], ['평균 종합 점수', avg == null ? '-' : Math.round(avg * 10) / 10], ['미달 인원', done.filter(x => x.c.lv === '미달').length + '명']];
    tiles.forEach(([k, v], i) => { s0.set(2, i * 2, k, H2); s0.merge(2, i * 2, 2, i * 2 + 1); s0.set(3, i * 2, v, { ...BC, bold: true, size: 13 }); s0.merge(3, i * 2, 3, i * 2 + 1); s0.set(2, i * 2 + 1, '', H2); s0.set(3, i * 2 + 1, '', BC); });
    s0.heights[3] = 26;
    s0.set(5, 0, 'Level 분포', { bold: true, color: '1F3A5F' });

// 교육 커리큘럼: 직급 단계(행) × 분야(열). 교육 가이드 데이터로 자동 구성
function vCurri() {
  const stages = [...S.config.guideStage].sort((a, b) => b.stage - a.stage);
  const req = S.courses.filter(c => c.type === '필수' && C.cStage(c) != null);
  const order = S.config.courseDeptOrder || [];
  const depts = [...new Set(req.map(c => c.dept).filter(d => d !== '공통'))].sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  const sel = S.people.find(p => p.id === ui.curPerson);
  const people = C.sortEdu(S.people.filter(p => eduActive(p)));
  const chip = c => {
    let cls = '', tip = `${c.name} · ${c.dept} · ${c.rank}`;
    if (sel) { const x = C.cell(c, sel); if (x.target) { cls = x.mark ? 'ok' : 'miss'; tip += x.mark ? ' · 이수' : ' · 미이수'; } else if (x.rec) { cls = 'ok'; tip += ' · 이수(미리 들음)'; } else cls = 'na'; }
    else { const tgt = S.people.filter(p => C.eduValid(p) && C.cell(c, p).target), dn = tgt.filter(p => C.cell(c, p).mark).length; if (tgt.length) tip += ` · 대상 ${tgt.length}명 중 ${dn}명 이수`; }
    if (c.delivery === '사내') tip += ` · 사내 (강사 ${c.teacher || '미정'})`; else if (c.delivery) tip += ' · 사외';
    return `<button type="button" class="cchip ${cls}" data-act="course-info" data-id="${c.id}" title="${esc(tip)}">${c.delivery ? `<span class="dv ${c.delivery === '사내' ? 'in' : 'out'}">${esc(c.delivery)}</span>` : '<span></span>'}<span class="cn">${esc(c.name)}</span>${c.delivery === '사내' ? `<span class="ins">${esc(c.teacher || '강사 미정')}</span>` : hasMat(c) ? '<span class="ins">📎</span>' : '<span></span>'}</button>`;
  };
  let h = `<label class="field"><span>개인별 이수 표시</span><select class="ci" data-act="f-curp"><option value="">선택 안 함</option>${people.map(p => `<option value="${p.id}"${p.id === ui.curPerson ? ' selected' : ''}>${esc(p.name)} · ${esc(p.team)} · ${esc(p.rank)}</option>`).join('')}</select></label>
    ${sel ? `<span class="legend-inline"><span class="pill ok">이수</span><span class="pill miss">미이수</span><span class="muted small">흐린 칸: 대상 아님</span></span>` : ''}</div>`;
  h += `<section class="card"><div class="head"><h2>연구소 교육 커리큘럼</h2><span class="sub">필수 교육 ${req.length}건</span></div>
    <div class="curri" style="--n:${depts.length}">
    <div class="cr-corner" style="grid-column:span 2">직급 \ 분야</div>${depts.map(d => `<div class="cr-dept">${esc(d)}</div>`).join('')}`;
  for (const st of stages) {
    const L = req.filter(c => C.cStage(c) === st.stage);
    if (!L.length) continue;
    const common = L.filter(c => c.dept === '공통'), own = depts.some(d => L.some(c => c.dept === d));
    const span = (own ? 1 : 0) + (common.length ? 1 : 0);
    h += `<div class="cr-stage" style="grid-row:span ${span}"><b>${esc(st.label.split('/').map(x => x.trim().replace(/\s*연구원$/, '') || x.trim()).join(' / '))}</b><small>${st.stage}단계 · ${L.length}과목</small></div>`;
    if (own) h += `<div class="cr-kind first">분야</div>` + depts.map(d => { const cs = L.filter(c => c.dept === d); return `<div class="cr-cell first${cs.length ? '' : ' empty'}">${cs.map(chip).join('')}</div>`; }).join('');
    if (common.length) h += `<div class="cr-kind cm${own ? '' : ' first'}">공통</div><div class="cr-common${own ? '' : ' first'}">${common.map(chip).join('')}</div>`;
  }
  h += `</div>`;
  const elect = S.courses.filter(c => c.type === '선택');
  if (elect.length) h += `<details class="cr-elect"><summary>선택 교육 <span class="muted">전 직급 공통 · ${elect.length}건</span></summary><div class="cr-elist">${elect.map(c => { const cnt = Object.values(S.edu).filter(m => m[c.id]).length; let cls = ''; if (sel) cls = (S.edu[sel.id] || {})[c.id] ? 'ok' : 'na'; return `<span class="cchip ${cls}" title="${esc(c.name)} · 이수 ${cnt}명">${esc(c.name)}</span>`; }).join('')}</div></details>`;
  h += `</section>`;
  return h;
}

function swParse(text) {

  if (ix.name < 0 || ix.qty < 0) throw new Error('제목 줄에 SW명과 보유 수량이 있어야 합니다');

}

const HR_COLS = { name: ['이름', '성명'], kind: ['전담여부', '구분'], pos: ['직위', '직급'], team: ['부서', '소속'], school: ['최종학교명', '학교', '최종학교'], major: ['전공'], degree: ['최종학위', '학위'], join: ['발령일', '입사일'], leave: ['퇴사일'] };
function hrParse(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!lines.length) throw new Error('붙여넣은 내용이 없습니다');
  const hd = lines[0].split('\t').map(v => v.trim()), idx = {};
  for (const [k, names] of Object.entries(HR_COLS)) idx[k] = hd.findIndex(v => names.includes(v));
  if (idx.name < 0 || idx.join < 0) throw new Error('제목 줄(이름 · 발령일 등)까지 같이 복사해 주세요');
  const day = v => { v = String(v || '').trim().replace(/[./]/g, '-'); const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : ''; };
  return lines.slice(1).map(l => l.split('\t')).map(c => { const g = k => idx[k] >= 0 ? String(c[idx[k]] ?? '').trim() : ''; const lv = g('leave');
    return { name: g('name').replace(/\s{2,}/g, ' '), kind: g('kind'), pos: g('pos'), team: g('team'), school: g('school'), major: g('major'), degree: g('degree'), join: day(g('join')), leave: day(lv), moved: !!lv && !day(lv) && /변동|전출|이동/.test(lv) }; })
    .filter(r => r.name);
}

    const old = S.people.find(p => p.id === id);
    const doc = { team: v.team, name, rank: v.rank, cat: v.cat, eduDept: v.eduDept, edu: !!v.edu, join: v.join || '', note: v.note || '', status: v.status || '', order: old ? old.order : Math.max(0, ...S.people.map(p => p.order || 0)) + 1 };
    if (!doc.status) delete doc.status;
    if (old && old.photo) doc.photo = old.photo;
    if (old) Object.assign(old, doc); else S.people.push({ id, ...doc });
    put('people/' + id, doc); rebuild(); closeDlg(); render(); toast('인원 정보를 저장했습니다');
  } else if (f.dataset.form === 'part') {
    const name = v.name.trim(); if (!name || S.parts.find(p => p.name === name)) { toast('이미 있는 파트입니다', true); return; }
    const id = uid('pt'); const order = S.config.partOrder.indexOf(name); const doc = { name, order: order < 0 ? 99 : order, items: [] };
    S.parts.push({ id, ...doc }); put('parts/' + id, doc); ui.setPart = id; rebuild(); closeDlg(); render();
  } else if (f.dataset.form === 'sw') {
    const id = f.dataset.id || uid('s'), old = S.sw.find(x => x.id === id), use = {};
    for (const [k, val] of Object.entries(v)) if (k.startsWith('u-') && +val > 0) use[k.slice(2)] = Math.round(+val);
    const doc = { owner: v.owner.trim(), name: v.name.trim(), qty: Math.round(+v.qty || 0), lic: v.lic, start: v.start || '', end: v.end || '', vendor: v.vendor.trim(), cost: v.cost === '' ? null : +v.cost, use, note: v.note.trim(), order: old ? old.order : Math.max(0, ...S.sw.map(x => x.order || 0)) + 1 };
    if (old) Object.assign(old, doc); else S.sw.push({ id, ...doc });
    put('sw/' + id, doc); closeDlg(); render(); toast('SW를 저장했습니다');
  } else if (f.dataset.form === 'swpaste') {
    let rows; try { rows = swParse(v.t); } catch (x) { $('#swperr').textContent = x.message; return; }
    if (!rows.length) { $('#swperr').textContent = '읽을 수 있는 줄이 없습니다.'; return; }
    if (!confirm(`SW ${rows.length}건으로 모두 바꿀까요?`)) return;
    const prevUse = {}; for (const x of S.sw) if (Object.keys(x.use || {}).length) (prevUse[(x.owner || '') + '|' + x.name] = prevUse[(x.owner || '') + '|' + x.name] || []).push(x.use);
    for (const r of rows) if (!Object.keys(r.use).length) { const q = prevUse[(r.owner || '') + '|' + r.name]; if (q && q.length) r.use = q.shift(); }
    const ops = S.sw.map(x => ({ path: 'sw/' + x.id, data: null })), next = rows.map((r, i) => ({ id: 's' + Date.now().toString(36) + i.toString(36).padStart(3, '0'), ...r }));
    for (const x of next) { const { id, ...doc } = x; ops.push({ path: 'sw/' + id, data: doc }); }
    putBatch(ops).then(() => { S.sw = next; closeDlg(); render(); toast(`SW ${next.length}건을 저장했습니다`); }).catch(x => { $('#swperr').textContent = '저장하지 못했습니다: ' + x.message; });
  } else if (f.dataset.form === 'asset') {
    const id = f.dataset.id || uid('a'), old = S.asset.find(x => x.id === id), n = k => v[k] === '' ? null : +v[k];
    const doc = { no: v.no.trim(), name: v.name.trim(), date: v.date || '', acct: v.acct.trim(), vendor: v.vendor.trim(), qty: n('qty'), cost: n('cost'), rest: n('rest'), dept: v.dept.trim(), fixed: v.fixed, site: v.site.trim(), loc: v.loc.trim(), note: v.note.trim() };
    if (old) Object.assign(old, doc); else S.asset.push({ id, ...doc });
    put('asset/' + id, doc); closeDlg(); render(); toast('자산을 저장했습니다');
  } else if (f.dataset.form === 'aspaste') {
    let rows; try { rows = asParse(v.t); } catch (x) { $('#aperr').textContent = x.message; return; }
    if (!rows.length) { $('#aperr').textContent = '읽을 수 있는 줄이 없습니다.'; return; }
    if (!confirm(`자산 ${rows.length}건으로 모두 바꿀까요?`)) return;
    const ops = S.asset.map(x => ({ path: 'asset/' + x.id, data: null }));
    const next = rows.map((r, i) => ({ id: 'a' + Date.now().toString(36) + i.toString(36).padStart(3, '0'), ...r }));
    for (const x of next) { const { id, ...doc } = x; ops.push({ path: 'asset/' + id, data: doc }); }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '저장 중…';
    putBatch(ops).then(() => { S.asset = next; closeDlg(); render(); toast(`자산 ${next.length}건을 저장했습니다`); })
      .catch(x => { btn.disabled = false; btn.textContent = '가져오기'; $('#aperr').textContent = '저장하지 못했습니다: ' + x.message; });
  } else if (f.dataset.form === 'seat') {
    closeDlg(); seatSet(f.dataset.path, v.p || v.t.trim() || '공석');
  } else if (f.dataset.form === 'seattext') {
    const m = seatParse(v.t); if (!m.blocks.length) { toast('배치가 비어 있습니다', true); return; }
    S.seat = m; put('seat/main', m); closeDlg(); render(); toast('자리 배치를 저장했습니다');
  } else if (f.dataset.form === 'hr') {
    if (!v.name.trim()) { $('#hrerr').textContent = '이름을 입력해 주세요.'; return; }
    if (v.st === '퇴사' && !v.leave) { $('#hrerr').textContent = '퇴사일을 입력해 주세요.'; return; }
    const id = f.dataset.id || uid('h'), old = S.hr.find(x => x.id === id);
    const doc = { name: v.name.trim(), kind: v.kind.trim(), pos: v.pos.trim(), team: v.team.trim(), school: v.school.trim(), major: v.major.trim(), degree: v.degree.trim(), part: (v.part || '').trim(), join: v.join || '', leave: v.st === '퇴사' ? v.leave : '', moved: v.st === '부서변동' };
    if (!doc.part) delete doc.part;
    if (old) Object.assign(old, doc); else S.hr.push({ id, ...doc });
    put('hr/' + id, doc); closeDlg(); hrSync(); render(); toast('인사 기록을 저장했습니다');
  } else if (f.dataset.form === 'hrpaste') {
    let rows; try { rows = hrParse(v.t); } catch (x) { $('#hperr').textContent = x.message; return; }
    if (!rows.length) { $('#hperr').textContent = '읽을 수 있는 줄이 없습니다.'; return; }
    if (!confirm(`${rows.length}명(재직 ${rows.filter(r => !r.leave && !r.moved).length}명)으로 인사 기록을 모두 바꿀까요?`)) return;
    const ops = [...S.hr.map(x => ({ path: 'hr/' + x.id, data: null }))];
    const next = rows.map((r, i) => ({ id: 'h' + Date.now().toString(36) + i.toString(36).padStart(3, '0'), ...r }));
    for (const x of next) { const { id, ...doc } = x; ops.push({ path: 'hr/' + id, data: doc }); }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '저장 중…';
    putBatch(ops).then(() => { S.hr = next; closeDlg(); hrSync(); render(); toast(`인사 기록 ${next.length}명을 저장했습니다`); })
      .catch(x => { btn.disabled = false; btn.textContent = '가져오기'; $('#hperr').textContent = '저장하지 못했습니다: ' + x.message; });
  } else if (f.dataset.form === 'org') {
    const o = orgCfg(); o.head = v.head.trim(); o.dev = v.dev.trim(); o.year = v.year.trim();
    for (const t of S.config.teamOrder) if (('lead-' + t) in v) o.leaders[t] = v['lead-' + t];
    const ex = []; for (let i = 0; ('u' + i + '-name') in v; i++) { const nm = v['u' + i + '-name'].trim(); if (!nm) continue;
      ex.push({ name: nm, head: v['u' + i + '-head'].trim(), teams: S.config.teamOrder.filter(t => ('u' + i + '-t-' + t) in v), part: v['u' + i + '-part'].trim(), members: v['u' + i + '-members'].trim() }); }
    o.exts = ex;
    for (const [key, val] of Object.entries(v)) { const m = key.match(/^n-(to|out|in)-(.+)$/); if (!m) continue; const n = val === '' ? null : Math.round(+val); o.to[m[2]] = { ...(o.to[m[2]] || {}), [m[1]]: n }; }
    saveOrg(); closeDlg(); render(); toast('조직 정보를 저장했습니다');
  } else if (f.dataset.form === 'hist') {
    const id = uid('h'); const doc = { ver: v.ver, rev: +v.rev || 0, date: v.date, author: v.author, change: v.change, note: '' };
    S.history.push({ id, ...doc }); put('history/' + id, doc); render();
  }
});

// ---------- export ----------
function snapshotData() {
  return { version: 1, exported: new Date().toISOString(), config: (({ id, ...c }) => c)(S.config), parts: S.parts, people: S.people, grades: S.grades, courses: S.courses, edu: S.edu, history: S.history, archive: S.archive, hr: S.hr, asset: S.asset, sw: S.sw, seat: S.seat };
}
function saveFile(filename, data) {
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const stamp = () => today().replace(/-/g, '').slice(2);
let lockProt;
async function exportXlsx(kind) {
  if (!C || !admin) return;
  toast('엑셀 파일을 만드는 중입니다…');
  try {
    if (lockProt === undefined) lockProt = (await api('lockHash')).prot;
  } catch (e) { toast('잠금 정보를 받지 못했습니다: ' + e.message, true); return; }
  if (!lockProt) toast('엑셀 잠금 비밀번호가 설정되지 않아 잠금 없이 내보냅니다', true);
  const sheets = kind === 'comp' ? Export.comp(S, C) : withYear(ui.eduYear ? +ui.eduYear : 0, () => Export.edu(S, C, ui.eduDept), true);
  const bytes = await XLSX.build(sheets, lockProt || null);
  const name = kind === 'comp' ? `${stamp()}_연구소 인원 역량평가 현황.xlsx` : `${stamp()}_연구소 교육 수료 현황${ui.eduYear ? '_' + ui.eduYear + '년 마감' : ''}${ui.eduDept && ui.eduDept !== '전체' ? '_' + ui.eduDept : ''}.xlsx`;
  saveFile(name, new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
function exportJson() { if (!C || !admin) return; saveFile(`${stamp()}_연구소관리_백업.json`, JSON.stringify(snapshotData(), null, 1)); }
async function importJson(file) {
  if (!file || !admin) return;
  let data; try { data = JSON.parse(await file.text()); } catch { toast('JSON 파일을 읽지 못했습니다', true); return; }
  if (!data.config || !Array.isArray(data.people) || !Array.isArray(data.courses)) { toast('이 사이트의 백업 파일이 아닙니다', true); return; }
  confirmDlg(`인원 ${data.people.length}명, 교육 ${data.courses.length}건 데이터로 현재 내용을 모두 바꿉니다. 계속할까요?`, '불러오기', async () => {
    await sendAll(data);
  });
}
function docsFromData(data) {
  const strip = ({ id, ...r }) => r, docs = { 'config/main': strip({ id: 0, ...data.config }) };
  for (const p of data.parts || []) docs['parts/' + p.id] = strip(p);
  for (const p of data.people) docs['people/' + p.id] = strip(p);
  for (const [k, g] of Object.entries(data.grades || {})) docs['grades/' + k] = { g };
  for (const c of data.courses) docs['courses/' + c.id] = strip(c);
  for (const [k, r] of Object.entries(data.edu || {})) docs['edu/' + k] = { r };
  for (const h of data.history || []) docs['history/' + h.id] = strip(h);
  for (const h of data.hr || []) docs['hr/' + h.id] = strip(h);
  for (const a of data.asset || []) docs['asset/' + a.id] = strip(a);
  for (const a of data.sw || []) docs['sw/' + a.id] = strip(a);
  if (data.seat) docs['seat/main'] = data.seat;
  for (const [k, v] of Object.entries(data.archive || {})) if (/^y\d{4}[ec]?$/.test(k)) docs['archive/' + k] = v;
  return docs;
}
async function sendAll(data) {
  const docs = docsFromData(data);
  toast(`${Object.keys(docs).length}건을 서버에 저장하는 중입니다…`);
  try { const d = await api('import', { docs }); toast(`${d.count}건을 불러왔습니다`); await reload(); }
  catch (e) { toast('불러오지 못했습니다: ' + e.message, true); }
}
async function importExcel(files) {
  if (!files || !files.length || !admin) return;
  let r;
  try { r = await XlsxRead.toData([...files], C ? snapshotData() : null); }
  catch (e) { toast('엑셀을 읽지 못했습니다: ' + e.message, true); return; }
  const what = [r.comp && '역량평가', r.edu && '교육 현황'].filter(Boolean).join(' · ');
  const keep = !r.comp ? '역량평가 데이터는 지금 것을 유지합니다.' : !r.edu ? '교육 데이터는 지금 것을 유지합니다.' : '';
  confirmDlg(`<b>${what}</b> 엑셀 내용으로 사이트 데이터를 바꿉니다. ${keep}<ul style="margin:8px 0 0;padding-left:18px">${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`, '엑셀로 바꾸기', () => sendAll(r.data));
}

function confirm_unsaved() { toast('저장 안 된 수정이 있습니다. 저장 버튼을 눌러 저장한 뒤 로그아웃하세요', true); flush(true); return false; }
function setDense(on) { document.body.classList.toggle('dense', on); const b = document.getElementById('denseBtn'); if (b) { b.setAttribute('aria-pressed', on); b.textContent = on ? '기본 크기로 보기' : '촘촘하게 보기'; } LS.set('lab_dense', on ? '1' : null); }
document.body.classList.add('dense');
// ---------- boot ----------
try { document.getElementById('cy').textContent = new Date().getFullYear(); } catch { }
whoUI(); syncUI(); render();
if (auth) { if (Object.keys(unsaved).length) { toast(`지난번에 저장되지 않은 수정 ${Object.keys(unsaved).length}건을 다시 저장합니다`); flush(); } reload(); } else checkSetup();
})();
